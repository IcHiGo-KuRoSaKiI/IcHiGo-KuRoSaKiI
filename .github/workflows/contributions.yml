name: Contribution Heatmap

# Triggers are schedule + manual ONLY — never pull_request — so the secret
# is never exposed to fork PRs (safe on a public repo).
on:
  schedule:
    - cron: '17 2 * * *'   # daily, ~02:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write          # lets the default GITHUB_TOKEN push the refreshed SVG

concurrency:
  group: contribution-heatmap
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate heatmap (counts commits across all repos — counts only)
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}   # read-only PAT, all repos
          GH_LOGIN: IcHiGo-KuRoSaKiI
          OUT: ./contributions.svg
        run: node .github/scripts/heatmap.mjs

      - name: Commit if the heatmap changed
        run: |
          if [[ -n "$(git status --porcelain contributions.svg)" ]]; then
            git config user.name  "IcHiGo-KuRoSaKiI"
            git config user.email "vedansh21.2000@gmail.com"
            git add contributions.svg
            git commit -m "chore: refresh contribution heatmap"
            git push
          else
            echo "No change in contributions.svg — nothing to commit."
          fi
